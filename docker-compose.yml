services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - RAG_CHROMA_PATH=/app/chroma_data
      - RAG_OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - chroma_data:/app/chroma_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
